  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #dfe3ea;
      --success: #15803d;
      --error: #dc2626;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 16px;
      font-family:
        Inter,
        system-ui,
        -apple-system,

      background: var(--background);
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 600px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
    }

    .drop-zone {
      display: block;
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 42px 20px;
      text-align: center;
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .drop-zone.selected {
      border-color: var(--success);
      background: #f0fdf4;
    }

    .drop-zone input {
      display: none;
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .drop-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .drop-description {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .selected-file {
      margin-top: 10px;
      color: var(--success);
      font-size: 0.9rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"],
    select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      color: var(--text);
      font: inherit;
    }

    input[type="number"]:focus,
    select:focus {
      outline: 2px solid rgba(37, 99, 235, 0.2);
      border-color: var(--primary);
    }

    .unit {
      color: var(--muted);
      font-size: 0.85rem;

    .presets {

    .image-box img {

    .privacy {

    }

    footer {

      font-size: 0.82rem;
    }

    @media (max-width: 650px) {
      body {
        padding: 24px 12px;
      }

      .card {
        padding: 16px;
      }

      .settings {
        grid-template-columns: 1fr;
      }

      .preview-grid {
        grid-template-columns: 1fr;
      }

      .image-box img {
        height: 220px;
      }

      .preset-buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }

      .preset-btn {
        width: 100%;
      }
    }

<body>

  <main class="container">

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const uploadIcon = document.getElementById("uploadIcon");
    const dropTitle = document.getElementById("dropTitle");
    const dropDescription = document.getElementById("dropDescription");
    const selectedFileElement = document.getElementById("selectedFile");

    const maxSizeInput = document.getElementById("maxSize");
    const maxWidthInput = document.getElementById("maxWidth");
    const formatInput = document.getElementById("format");
    const presetButtons = document.querySelectorAll(".preset-btn");
    const compressBtn = document.getElementById("compressBtn");
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const preview = document.getElementById("preview");
    const originalPreview = document.getElementById("originalPreview");
    const resultPreview = document.getElementById("resultPreview");
    const originalInfo = document.getElementById("originalInfo");
    const resultInfo = document.getElementById("resultInfo");
    const resultSize = document.getElementById("resultSize");
    const saving = document.getElementById("saving");
    const downloadBtn = document.getElementById("downloadBtn");

    let selectedFile = null;
    let originalObjectUrl = null;
    let resultObjectUrl = null;

    function formatBytes(bytes) {
      if (bytes < 1024) {
        return `${bytes} B`;
      }

      if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(1)} KB`;
      }

      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    function setStatus(message) {
      status.textContent = message;
    }

    function clearResultUrl() {
      if (resultObjectUrl) {
        URL.revokeObjectURL(resultObjectUrl);
        resultObjectUrl = null;
      }
    }

    function clearOriginalUrl() {
      if (originalObjectUrl) {
        URL.revokeObjectURL(originalObjectUrl);
        originalObjectUrl = null;
      }
    }

    function updateSelectedFileUI(file) {
      dropZone.classList.add("selected");

      uploadIcon.textContent = "✅";

      dropTitle.textContent = "Image selected";

      dropDescription.textContent =
        "Click here to choose a different image";

      selectedFileElement.textContent =
        `${file.name} · ${formatBytes(file.size)}`;

      selectedFileElement.style.display = "block";
    }

    function updatePresetState(value) {
      presetButtons.forEach(button => {
        const buttonSize = Number(button.dataset.size);

        button.classList.toggle(
          "active",
          buttonSize === Number(value)
        );
      });
    }

    presetButtons.forEach(button => {
      button.addEventListener("click", () => {
        const size = Number(button.dataset.size);

        maxSizeInput.value = size;

        updatePresetState(size);

        clearError();

        setStatus(`Target size set to ${size}KB.`);
      });
    });

    maxSizeInput.addEventListener("input", () => {
      updatePresetState(maxSizeInput.value);
    });

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();

        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };

        image.onerror = () => {
          URL.revokeObjectURL(url);

          reject(
            new Error("Could not read this image.")
          );
        };

        image.src = url;
      });
    }

    function createCanvas(image, width, height) {
      const canvas = document.createElement("canvas");

      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext("2d", {
        alpha: true
      });

      context.drawImage(
        image,
        0,
        0,
        width,
        height
      );

      return canvas;
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(
          blob => {
            if (!blob) {
              reject(
                new Error(
                  "Browser could not create the image."
                )
              );

              return;
            }

            resolve(blob);
          },
          type,
          quality
        );
      });
    }

    function calculateDimensions(
      originalWidth,
      originalHeight,
      maxWidth
    ) {
      if (originalWidth <= maxWidth) {
        return {
          width: originalWidth,
          height: originalHeight
        };
      }

      const ratio = maxWidth / originalWidth;

      return {
        width: Math.max(
          1,
          Math.round(originalWidth * ratio)
        ),

        height: Math.max(
          1,
          Math.round(originalHeight * ratio)
        )
      };
    }

    async function encode(
      image,
      width,
      height,
      format,
      quality
    ) {
      const canvas = createCanvas(
        image,
        width,
        height
      );

      const blob = await canvasToBlob(
        canvas,
        format,
        quality
      );

      return {
        blob,
        width,
        height
      };
    }

    async function compressWithQuality(
      image,
      width,
      height,
      format,
      targetBytes
    ) {
      let low = 0.05;
      let high = 0.95;
      let best = null;

      const highResult = await encode(
        image,
        width,
        height,
        format,
        high
      );

      if (highResult.blob.size <= targetBytes) {
        return highResult;
      }

      const lowResult = await encode(
        image,
        width,
        height,
        format,
        low
      );

      if (lowResult.blob.size > targetBytes) {
        return null;
      }

      best = lowResult;

      for (let i = 0; i < 9; i++) {
        const middle = (low + high) / 2;

        const result = await encode(
          image,
          width,
          height,
          format,
          middle
        );

        if (result.blob.size <= targetBytes) {
          best = result;
          low = middle;
        } else {
          high = middle;
        }
      }

      return best;
    }

    async function compressPng(
      image,
      width,
      height,
      targetBytes
    ) {
      let currentWidth = width;
      let currentHeight = height;

      for (let i = 0; i < 10; i++) {
        const result = await encode(
          image,
          currentWidth,
          currentHeight,
          "image/png"
        );

        if (result.blob.size <= targetBytes) {
          return result;
        }

        currentWidth = Math.max(
          1,
          Math.floor(currentWidth * 0.85)
        );

        currentHeight = Math.max(
          1,
          Math.floor(currentHeight * 0.85)
        );
      }

      return null;
    }

    async function compressImage(
      image,
      targetBytes,
      maxWidth,
      format
    ) {
      const dimensions = calculateDimensions(
        image.naturalWidth,
        image.naturalHeight,
        maxWidth
      );

      let result;

      if (format === "image/png") {
        result = await compressPng(
          image,
          dimensions.width,
          dimensions.height,
          targetBytes
        );
      } else {
        result = await compressWithQuality(
          image,
          dimensions.width,
          dimensions.height,
          format,
          targetBytes
        );
      }

      if (result) {
        return result;
      }

      let width = Math.floor(
        dimensions.width * 0.85
      );

      let height = Math.floor(
        dimensions.height * 0.85
      );

      for (let i = 0; i < 8; i++) {
        if (width < 1 || height < 1) {
          break;
        }

        if (format === "image/png") {
          result = await compressPng(
            image,
            width,
            height,
            targetBytes
          );
        } else {
          result = await compressWithQuality(
            image,
            width,
            height,
            format,
            targetBytes
          );
        }

        if (result) {
          return result;
        }

        width = Math.floor(width * 0.85);
        height = Math.floor(height * 0.85);
      }

      return null;
    }

    async function handleFile(file) {
      clearError();
      clearResultUrl();
      clearOriginalUrl();

      preview.style.display = "none";
      setStatus("");

      if (!file) {
        return;
      }

      if (!file.type.startsWith("image/")) {
        showError(
          "Please choose a valid image file."
        );

        return;
      }

      try {
        const image = await loadImage(file);

        selectedFile = file;

        originalObjectUrl =
          URL.createObjectURL(file);

        originalPreview.src =
          originalObjectUrl;

        originalInfo.textContent =
          `${formatBytes(file.size)} · ` +
          `${image.naturalWidth} × ` +
          `${image.naturalHeight}px`;

        updateSelectedFileUI(file);

        compressBtn.disabled = false;

        setStatus(
          "Image ready to compress."
        );
      } catch (error) {
        selectedFile = null;
        compressBtn.disabled = true;

        showError(
          "Could not read this image. Please try another file."
        );
      }
    }

    fileInput.addEventListener(
      "change",
      event => {
        const file = event.target.files[0];

        handleFile(file);
      }
    );

    dropZone.addEventListener(
      "dragover",
      event => {
        event.preventDefault();

        dropZone.classList.add(
          "drag-over"
        );
      }
    );

    dropZone.addEventListener(
      "dragleave",
      () => {
        dropZone.classList.remove(
          "drag-over"
        );
      }
    );

    dropZone.addEventListener(
      "drop",
      event => {
        event.preventDefault();

        dropZone.classList.remove(
          "drag-over"
        );

        const file =
          event.dataTransfer.files[0];

        handleFile(file);
      }
    );

    compressBtn.addEventListener(
      "click",
      async () => {
        if (!selectedFile) {
          return;
        }

        clearError();
        clearResultUrl();

        const maxSize =
          Number(maxSizeInput.value);

        const maxWidth =
          Number(maxWidthInput.value);

        const format =
          formatInput.value;

        if (
          !Number.isFinite(maxSize) ||
          maxSize <= 0
        ) {
          showError(
            "Maximum file size must be greater than 0."
          );

          return;
        }

        if (
          !Number.isFinite(maxWidth) ||
          maxWidth <= 0
        ) {
          showError(
            "Maximum width must be greater than 0."
          );

          return;
        }

        const targetBytes =
          maxSize * 1024;

        compressBtn.disabled = true;

        preview.style.display = "none";

        setStatus(
          "Compressing image..."
        );

        try {
          const image =
            await loadImage(selectedFile);

          const startTime =
            performance.now();

          const result =
            await compressImage(
              image,
              targetBytes,
              Math.floor(maxWidth),
              format
            );

          const duration =
            Math.round(
              performance.now() - startTime
            );

          if (!result) {
            throw new Error(
              "Could not reduce this image to the requested size."
            );
          }

          if (result.blob.size > targetBytes) {
            throw new Error(
              "The image could not be compressed below the requested size."
            );
          }

          resultObjectUrl =
            URL.createObjectURL(
              result.blob
            );

          resultPreview.src =
            resultObjectUrl;

          resultInfo.textContent =
            `${formatBytes(result.blob.size)} · ` +
            `${result.width} × ` +
            `${result.height}px`;

          resultSize.textContent =
            `${formatBytes(result.blob.size)}`;

          const percentage =
            Math.max(
              0,
              Math.round(
                (
                  1 -
                  result.blob.size /
                  selectedFile.size
                ) * 100
              )
            );

          if (
            result.blob.size <
            selectedFile.size
          ) {
            saving.textContent =
              `${percentage}% smaller · ` +
              `Processed in ${duration}ms`;
          } else {
            saving.textContent =
              `Processed in ${duration}ms`;
          }

          let extension = "jpg";

          if (format === "image/webp") {
            extension = "webp";
          }

          if (format === "image/png") {
            extension = "png";
          }

          downloadBtn.href =
            resultObjectUrl;

          downloadBtn.download =
            `compressed-image.${extension}`;

          preview.style.display = "block";

          setStatus(
            "Compression complete."
          );
        } catch (error) {
          showError(
            error.message ||
            "Something went wrong while compressing the image."
          );

          setStatus("");
        } finally {
          compressBtn.disabled = false;
        }
      }
    );
  </script>

</body>
</html>
